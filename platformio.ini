; CYD live dashboard: clock, weather (Houston + Williston), $CHRD ticker
[platformio]
default_envs = cyd

[env:cyd]
; Pinned: Arduino core 2.0.17 (what this has been running stably on).
; Unpinned, PlatformIO silently jumped to platform 8 / core 3.x.
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	tzapu/WiFiManager@^2.0.17
	bblanchon/ArduinoJson@^7.2.0
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions = min_spiffs.csv
build_flags =
	-DUSER_SETUP_LOADED
	-DUSE_HSPI_PORT
	-DILI9341_2_DRIVER
	-DTFT_INVERSION_ON          ; this particular panel needs inversion
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_GFXFF

; Temporary artwork preview: skips Wi-Fi and NTP, saved network is left alone
[env:preview]
extends = env:cyd
build_flags =
	${env:cyd.build_flags}
	-DPREVIEW_OFFLINE
